<dialog class="admission-dialog" id="admission-dialog" aria-labelledby="admission-modal-title">
    <div class="admission-dialog-header">
        <div class="admission-dialog-copy">
            <p class="admission-dialog-kicker">STUDENT APPLICATION</p>
            <h2 id="admission-modal-title">Apply for Admission</h2>
            <p class="admission-dialog-subtitle">Share a few details to begin your music journey.</p>
        </div>
        <button class="admission-dialog-close" type="button" data-close-admission aria-label="Close admission form">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <iframe class="admission-frame" src="{{ url_for('admission') }}" title="Music Academy admission form"></iframe>
</dialog>
