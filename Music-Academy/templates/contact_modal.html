<div class="contact-division" id="contactDivision">
    <div class="contact-popup">
        <button type="button" class="contact-close" id="contactClose" aria-label="Close Contact Popup">
            &times;
        </button>
        <h2>Contact Us</h2>
        <div class="contact-intro">
            <p>Have a question or want to know more about our courses? We'd love to hear from you.</p>
        </div>
        <div class="contact-info">
            <div class="contact-info-item">
                <span class="contact-icon">✉</span>
                <div>
                    <h3>Email</h3>
                    <p>academy@email.com</p>
                </div>
            </div>
            <div class="contact-info-item">
                <span class="contact-icon">☎</span>
                <div>
                    <h3>Phone</h3>
                    <p>+91 XXXXX XXXXX</p>
                </div>
            </div>
            <div class="contact-info-item">
                <span class="contact-icon">⌖</span>
                <div>
                    <h3>Location</h3>
                    <p>Puri, Odisha, India</p>
                </div>
            </div>
        </div>
        <div class="contact-purpose">
            <h3>What can we help you with?</h3>
            <div class="purpose-options">
                <button type="button" class="purpose-btn" data-purpose="Course Inquiry" aria-pressed="false">
                    <span>🎓</span>
                    <span>Course Inquiry</span>
                </button>
                <button type="button" class="purpose-btn" data-purpose="Instrument Classes" aria-pressed="false">
                    <span>🎸</span>
                    <span>Instrument Classes</span>
                </button>
                <button type="button" class="purpose-btn" data-purpose="Fees & Scholarships"
                    data-message="Hello, I would like to learn more about scholarship opportunities. Could you please share the eligibility criteria and how to apply?"
                    aria-pressed="false">
                    <span>💰</span>
                    <span>Fees &amp; Scholarships</span>
                </button>
                <button type="button" class="purpose-btn" data-purpose="Technical Support" aria-pressed="false">
                    <span>🛠</span>
                    <span>Technical Support</span>
                </button>
            </div>
        </div>
        <form class="contact-form" id="contactForm">
            <h3>Send us a message</h3>
            <div class="contact-field">
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName" name="name" placeholder="Enter your name" autocomplete="name"
                    required>
            </div>
            <div class="contact-field">
                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail" name="email" placeholder="Enter your email" autocomplete="email"
                    required>
            </div>
            <div class="contact-field">
                <label for="contactSubject">Subject</label>
                <input type="text" id="contactSubject" name="subject" placeholder="What is your message about?"
                    required>
            </div>
            <div class="contact-field">
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message" rows="5" placeholder="Write your message here..."
                    required></textarea>
            </div>
            <button type="submit" class="contact-submit">Send Message</button>
            <p class="contact-success" id="contactSuccess" aria-live="polite"></p>
        </form>
    </div>
</div>
